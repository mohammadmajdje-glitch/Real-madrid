<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>مدیرعامل مادرید</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --panel:#FFFFFF; --ink:#101B3B; --mute:#5D6785; --line:#DDE2EC;
  --gold:#A8842F; --gold-soft:#F3EAD3; --red:#C23A3A; --green:#1F8A5B;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Vazirmatn,"Noto Sans Arabic","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-top:var(--safe-t)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.danger{color:var(--red);border-color:var(--red);margin:24px 0}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel)}
label{display:block;margin:10px 0;color:var(--mute);font-size:13px}
label input{margin-top:4px}
h3{margin:22px 0 6px;font-size:15px}
.hint{color:var(--mute);font-size:13px;margin:6px 0}

header{position:fixed;top:var(--safe-t);inset-inline:0;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:var(--ink);color:#fff;z-index:5}
header small{display:block;font-size:11px;opacity:.7;line-height:1.2}
header .club b{font-size:17px;letter-spacing:.2px}
header .budget{text-align:left}
header .budget b{color:#E6C980;font-size:17px}

main{padding:calc(56px + 12px) 14px calc(140px + var(--safe-b))}
.tab{display:none}
body[data-tab=office] #tab-office,body[data-tab=market] #tab-market,body[data-tab=lineup] #tab-lineup,body[data-tab=match] #tab-match,body[data-tab=club] #tab-club{display:block}

nav{position:fixed;bottom:0;inset-inline:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
nav button{border:0;border-radius:0;background:none;padding:12px 0;color:var(--mute)}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}

#composer{position:fixed;inset-inline:0;bottom:calc(48px + var(--safe-b));display:none;gap:8px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--line);z-index:4}
body[data-tab=office] #composer{display:flex}
#composer textarea{resize:none;max-height:110px}

/* chat */
.msg{margin:14px 0;max-width:92%}
.msg.me{margin-inline-start:auto;background:var(--ink);color:#fff;padding:9px 14px;border-radius:14px 14px 4px 14px;white-space:pre-wrap}
.msg.ai{border-inline-start:3px solid var(--gold);padding:2px 12px;white-space:pre-wrap}
.msg.sys{color:var(--mute);font-size:13px;text-align:center;max-width:100%}
.news{margin-top:8px;font-size:13.5px;border-top:1px solid var(--line)}
.news div{padding:6px 0;border-bottom:1px solid var(--line)}
.news b{color:var(--gold)}
.note{display:inline-block;margin:6px 6px 0 0;background:var(--gold-soft);padding:1px 10px;border-radius:99px;font-size:13px}
.warn{color:var(--red);font-size:12px;margin-top:4px}
.typing{color:var(--mute)}

/* lists */
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button.on{background:var(--gold-soft);border-color:var(--gold)}
.row-in{display:flex;gap:8px;margin:8px 0}
.row-in select{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.item small{color:var(--mute);display:block;line-height:1.4}
.ovr{min-width:38px;text-align:center;font-weight:700;padding:2px 0;border-radius:6px;background:var(--gold-soft);color:var(--ink)}
.pos{font-size:11px;color:var(--mute);width:26px}
.item.start{background:linear-gradient(90deg,transparent,var(--gold-soft))}
.item.inj .ovr{background:#F7DADA;color:var(--red)}
.group{margin:16px 0 0;font-size:13px;color:var(--mute);font-weight:700}
.val{margin-top:4px;font-size:13px;background:var(--gold-soft);padding:6px 10px;border-radius:8px;white-space:pre-wrap}

/* match */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:14px 0;border-bottom:2px solid var(--ink)}
.board .sc{font-size:34px;font-weight:800;direction:ltr;letter-spacing:2px}
.board small{display:block;color:var(--mute)}
.feed{margin-top:8px}
.ev{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev .m{width:34px;color:var(--mute);direction:ltr;text-align:right}
.ev.goal{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--mute);font-weight:500;font-size:12px}
.rt{font-weight:700;text-align:center;border-radius:6px;padding:1px 6px;color:#fff;background:#8590AD}
.rt.hi{background:var(--green)} .rt.lo{background:var(--red)} .rt.mv{background:var(--gold)}

/* meters */
.meter{margin:12px 0}
.meter .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ink)}
.meter span{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}

#toast{position:fixed;inset-inline:16px;bottom:calc(110px + var(--safe-b));background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--bg:#FFFFFF;--ink:#0B1D3F;--gold:#B8912F;--gold-soft:#FBF3DC;--line:#E4E7EF}
header{background:linear-gradient(180deg,#0B1D3F,#08152E);border-bottom:3px solid #C9A227}
header .club{display:flex;align-items:center;gap:10px}header .club b{font-family:Cinzel,serif;letter-spacing:2px;font-size:16px}
.crest{width:34px;height:34px;object-fit:contain}
nav{grid-template-columns:repeat(6,1fr)}nav button{font-size:12.5px;padding:12px 0}
body[data-tab=fin] #tab-fin{display:block}
#tab-lineup .row-in{display:none}
.ph{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#EEF0F5;flex:none}.ph.big{width:64px;height:64px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button{border-radius:99px;font-size:13px;padding:5px 12px;background:var(--gold-soft);border-color:#E7D7A5}
#modal{position:fixed;inset:0;background:rgba(8,21,46,.55);z-index:20;display:flex;align-items:flex-end}#modal[hidden]{display:none}
#modal .card{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + var(--safe-b));border-top:4px solid #C9A227;position:relative}
#modal .x{position:absolute;inset-inline-start:10px;top:10px;padding:2px 10px}
td small{display:block;color:var(--mute)}
.lg{width:24px;height:24px;object-fit:contain;flex:none}

#tweets{position:fixed;top:calc(84px + env(safe-area-inset-top,0px));inset-inline-start:10px;width:min(300px,82vw);z-index:15;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tw-pop{pointer-events:auto;animation:twin .35s ease-out}@keyframes twin{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.tw{display:flex;gap:8px;background:#fff;border:1px solid #DDE3EE;border-radius:14px;padding:10px;box-shadow:0 6px 18px rgba(8,21,46,.18);color:#0B1D3F;margin-top:6px}
.tw-av{width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}.tw-b{min-width:0}
.tw-h{display:flex;gap:4px;align-items:center;font-size:13px;flex-wrap:wrap}.tick{color:#1d9bf0;font-size:11px}.tw-h small{color:#8a93a6}
.tw-t{font-size:13.5px;margin:3px 0 5px;line-height:1.6}.tw-f{display:flex;gap:10px;font-size:11px;color:#8a93a6}
.scout{margin-top:8px;padding:8px 10px;background:#FBF3DC;border-radius:10px;font-size:12.5px;line-height:1.7;color:#0B1D3F}
</style>
</head>
<body data-tab="office">
<header>
  <div class="club"><img class="crest" src="https://media.api-sports.io/football/teams/541.png" onerror="this.remove()"><span><b>REAL MADRID</b><small id="hDate"></small></span></div>
  <div class="budget"><small>بودجه</small><b id="hBudget"></b></div>
</header>

<main>
  <section class="tab" id="tab-office">
    <div class="chips" id="chips"><button data-t="با ایجنت بازیکن تماس می‌گیرم: ">🧑‍💼 ایجنت</button><button data-t="با باشگاه فروشنده مذاکره می‌کنم: ">🏟️ باشگاه</button><button data-t="پیام برای رسانه‌ها و خبرنگاران: ">📰 رسانه</button><button data-t="با هیئت‌مدیره جلسه می‌گذارم: ">🏛️ هیئت‌مدیره</button><button data-t="با مربی حرف می‌زنم: ">🧢 مربی</button></div>
    <div id="chat"></div>
  </section>

  <section class="tab" id="tab-market">
    <div class="seg">
      <button data-kind="player" class="on">بازیکن</button>
      <button data-kind="coach">مربی</button>
    </div>
    <div class="row-in">
      <input id="q" placeholder="نام را بنویس (حداقل ۳ حرف، لاتین)" autocomplete="off">
      <button id="qGo" class="primary">جستجو</button>
    </div>
    <div id="results"></div>
  </section>

  <section class="tab" id="tab-lineup">
    <div class="row-in">
      <select id="formation"></select>
      <button id="auto">چیدمان خودکار</button>
    </div>

  <section class="tab" id="tab-match">
    <div id="matchView"></div>
  </section>

  <section class="tab" id="tab-club">
    <div id="meters"></div>
    <h3>تنظیمات اتصال</h3>
    <label>آدرس Worker فوت‌موب (رایگان)<input id="setFm" placeholder="https://xxx.workers.dev" dir="ltr"></label>

  </section>
<section class="tab" id="tab-fin">
    <div id="finBox"></div>
    <button id="finGo" class="primary">دریافت اطلاعات مالی واقعی</button>
    <h3>اختیارات رئیس باشگاه</h3>
    <div class="chips" id="powers"><button data-t="می‌خواهم مربی فعلی اخراج شود. نظر هیئت‌مدیره را بگیر، رأی‌گیری کن و اگر تصویب شد مربی جایگزین پیشنهاد بده. ">اخراج مربی</button><button data-t="می‌خواهم قرارداد این بازیکن را فسخ کنیم: (نام). هیئت‌مدیره و هزینه فسخ را بررسی کن. ">فسخ قرارداد بازیکن</button><button data-t="اسپانسر جدید برای باشگاه پیدا کن و مبلغ قرارداد را مذاکره کن. ">اسپانسر جدید</button><button data-t="قیمت بلیت و فروش مرچندایز را بازنگری کن. ">بلیت و مرچندایز</button><button data-t="ساختار دستمزدها را با هیئت‌مدیره بازنگری می‌کنم. ">دستمزدها</button></div>
  </section>
</main>

<form id="composer">
  <textarea id="msg" rows="1" placeholder="هر چه می‌خواهی بنویس: مثلاً «با مربی درباره ترکیب حرف می‌زنم»"></textarea>
  <button class="primary" type="submit">ارسال</button>
</form>

<nav>
  <button data-tab="office" class="on">دفتر</button>
  <button data-tab="market">بازار</button>
  <button data-tab="lineup">ترکیب</button>
  <button data-tab="match">مسابقه</button>
  <button data-tab="club">باشگاه</button>
  <button data-tab="fin">مالی</button>
</nav>
<div id="toast"></div>
<div id="modal" hidden></div>
<div id="tweets"></div>
<script>
'use strict';
/* ============ ابزارها ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'madrid-ceo-v2', MADRID = 541, SEASON = 2026;
const POS = { Goalkeeper: 'GK', Defender: 'DF', Midfielder: 'MF', Attacker: 'FW' };
const POSL = { G: 'GK', D: 'DF', M: 'MF', F: 'FW' };
const POSFA = { GK: 'دروازه‌بان', DF: 'مدافع', MF: 'هافبک', FW: 'مهاجم' };
const FORM = { '4-3-3': [4, 3, 3], '4-4-2': [4, 4, 2], '3-5-2': [3, 5, 2], '4-2-3-1': [4, 5, 1], '5-3-2': [5, 3, 2] };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

/* ============ داده نمونه (فقط برای حالت آفلاین/دمو) ============ */
function demoTeam(prefix, base, idBase) {
  const out = []; let n = 0;
  [['GK', 3], ['DF', 8], ['MF', 7], ['FW', 5]].forEach(([pos, c]) => {
    for (let i = 1; i <= c; i++) out.push({ id: idBase + (++n), name: `${prefix} ${POSFA[pos]} ${i}`, pos, age: Math.round(rnd(19, 34)), ovr: Math.round(clamp(base + rnd(-7, 7) - i * 0.8, 50, 95)), value: null });
  });
  return out;
}
function demoFixtures() {
  return ['آلفا', 'بتا', 'گاما', 'دلتا', 'اپسیلون'].map((n, i) => ({
    id: 'd' + i, date: addDays('2026-08-15', i * 7), comp: 'نمونه',
    home: i % 2 ? { id: 9000 + i, name: 'باشگاه ' + n } : { id: MADRID, name: 'رئال مادرید' },
    away: i % 2 ? { id: MADRID, name: 'رئال مادرید' } : { id: 9000 + i, name: 'باشگاه ' + n },
    demoStrength: 70 + i * 3
  }));
}

/* ============ داده واقعی فصل ۲۰۲۶/۲۷ (اسنپ‌شات ۲۰ سپتامبر ۲۰۲۶؛ منبع: شماره‌گذاری رسمی رئال، برنامه رسمی UEFA/رئال) ============ */
/* نام‌ها و پست‌ها از لیست رسمی است؛ سن (از سال تولد) و رتبه (ovr) تقریبی و تخمین خود اپ است، نه رتبه رسمی فیفا. با «همگام‌سازی» از API جایگزین می‌شود. */
const REAL_COACH = 'José Mourinho';
const REAL_SQUAD = () => [
  ['Courtois','GK',34,89],['Lunin','GK',27,79],
  ['Asencio','DF',23,77],['Éder Militão','DF',28,82],['Dean Huijsen','DF',21,79],['Trent Alexander-Arnold','DF',28,84],['Ibrahima Konaté','DF',27,82],['Marc Cucurella','DF',28,82],['Álvaro Carreras','DF',23,79],['Antonio Rüdiger','DF',33,84],['Ferland Mendy','DF',31,78],['Denzel Dumfries','DF',30,80],
  ['Jude Bellingham','MF',23,89],['Eduardo Camavinga','MF',24,83],['Federico Valverde','MF',28,86],['Aurélien Tchouaméni','MF',26,83],['Arda Güler','MF',21,83],['Bernardo Silva','MF',32,86],['Thiago Pitarch','MF',19,68],
  ['Vinícius Júnior','FW',26,89],['Endrick','FW',20,78],['Kylian Mbappé','FW',27,91],['Rodrygo','FW',25,82],['Carlos Espí','FW',21,68],['Brahim Díaz','FW',27,81],['Yan Diomande','FW',20,82]
].map(([name, pos, age, ovr], i) => ({ id: 'rm' + i, name, pos, age, ovr, value: null, est: true }));
const T = (id, name) => ({ id, name }), RM = T(MADRID, 'رئال مادرید');
const REAL_FIXTURES = () => [
  ['2026-09-20','لالیگا',0,T(9001,'Atlético Madrid'),82],['2026-10-10','لالیگا',1,T(9002,'Villarreal'),78],['2026-10-14','لیگ قهرمانان',0,T(9003,'Roma'),78],
  ['2026-10-18','لالیگا',1,T(9004,'Sevilla'),75],['2026-10-21','لیگ قهرمانان',1,T(9005,'RB Leipzig'),80],['2026-10-25','لالیگا',0,T(9006,'Barcelona'),87],
  ['2026-11-04','لیگ قهرمانان',0,T(9007,'AEK Athens'),72],['2026-11-24','لیگ قهرمانان',1,T(9008,'PSV'),78],['2026-12-09','لیگ قهرمانان',0,T(9009,'Arsenal'),86],
  ['2027-01-19','لیگ قهرمانان',1,T(9010,'LASK'),70],['2027-01-27','لیگ قهرمانان',0,T(9011,'Shakhtar Donetsk'),73]
].map(([date, comp, home, opp, s], i) => ({ id: 'd' + i, date, comp, home: home ? RM : opp, away: home ? opp : RM, demoStrength: s }));
const REAL_RESULTS = [
  { text: 'Real Betis 1-0 رئال مادرید', outcome: 'L' }, { text: 'رئال مادرید 2-1 Inter (لیگ قهرمانان)', outcome: 'W' },
  { text: 'رئال مادرید 4-1 Rayo Vallecano', outcome: 'W' }, { text: 'Elche 2-3 رئال مادرید', outcome: 'W' }
];

/* ============ وضعیت ============ */
const fresh = () => ({
  server: '', token: '', date: '2026-09-20', budget: 150, board: 60, coach: 60, fans: 60,
  squad: REAL_SQUAD(), lineup: [], formation: '4-3-3', fixtures: REAL_FIXTURES(), results: REAL_RESULTS.slice(), chat: [], real: false, coachName: REAL_COACH, fm: '', done: {}, coachEdited: false, moved: {}, sponsors: [], clubInfo: ''
});
function load() { try { return { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch { return fresh(); } }
let S = load();
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const isInj = p => p.injUntil && p.injUntil > S.date;

/* ============ شبکه ============ */
async function api(path, opts = {}) {
  if (!S.server) throw new Error('آدرس سرور در تب «باشگاه» تنظیم نشده');
  const r = await fetch(S.server.replace(/\/$/, '') + path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-app-token': S.token || '' } });
  if (!r.ok) throw new Error((await r.text()).slice(0, 160) || r.status);
  return r.json();
}
const football = (p, q = {}) => api('/api/football/' + p + '?' + new URLSearchParams(q));

async function loadTeamSquad(teamId) {
  const sq = await football('players/squads', { team: teamId });
  const list = sq.response?.[0]?.players || [];
  const players = list.map(p => ({ id: p.id, name: p.name, age: p.age || 25, pos: POS[p.position] || 'MF', ovr: 74, rated: false, value: null }));
  for (const season of [SEASON, SEASON - 1]) {
    try {
      for (let page = 1; page <= 3; page++) {
        const r = await football('players', { team: teamId, season, page });
        (r.response || []).forEach(x => {
          const pl = players.find(p => p.id === x.player.id);
          const rt = parseFloat(x.statistics?.[0]?.games?.rating);
          if (pl && !pl.rated && rt) { pl.ovr = clamp(Math.round(60 + (rt - 6) * 12), 55, 94); pl.rated = true; }
        });
        if (page >= (r.paging?.total || 1)) break;
      }
    } catch { /* ادامه با مقدار پیش‌فرض */ }
  }
  return players;
}

/* ============ رابط عمومی ============ */

function autoPick(squad, formation) {
  const [d, m, f] = FORM[formation], need = { GK: 1, DF: d, MF: m, FW: f }, pick = [];
  const avail = squad.filter(p => !isInj(p)).sort((a, b) => b.ovr - a.ovr);
  for (const pos of ['GK', 'DF', 'MF', 'FW']) pick.push(...avail.filter(p => p.pos === pos).slice(0, need[pos]));
  for (const p of avail) if (pick.length < 11 && !pick.includes(p)) pick.push(p);
  return pick.slice(0, 11);
}
function lineupError(xi, formation = S.formation) {
  if (xi.length !== 11) return `باید ۱۱ بازیکن انتخاب کنی (الان ${xi.length})`;
  const [d, m, f] = FORM[formation], c = k => xi.filter(p => p.pos === k).length;

  if (c('DF') !== d || c('MF') !== m || c('FW') !== f) return `ترکیب با چیدمان ${formation} نمی‌خواند`;
  if (xi.some(isInj)) return 'یک بازیکن مصدوم در ترکیب است';

/* ============ موتور مسابقه ============ */
function strength(xi) {
  const av = a => a.length ? a.reduce((s, p) => s + p.ovr, 0) / a.length : 55, f = k => xi.filter(p => p.pos === k);
  return { gk: av(f('GK')), def: av(f('DF')), mid: av(f('MF')), att: av(f('FW')) };
}
function wpick(list, w) { const t = list.reduce((s, p) => s + w(p), 0); let r = Math.random() * t; for (const p of list) { r -= w(p); if (r <= 0) return p; } return list[0]; }
function simulate(H, A) {
  const side = { h: { ...H, st: strength(H.xi), g: 0 }, a: { ...A, st: strength(A.xi), g: 0 } };
  const stat = new Map(), ST = p => { if (!stat.has(p)) stat.set(p, { g: 0, a: 0, sv: 0, y: 0, r: 0 }); return stat.get(p); };
  const events = [];
  for (let m = 1; m <= 90; m++) {
    const pH = clamp(side.h.st.mid / (side.h.st.mid + side.a.st.mid) + 0.02, 0.3, 0.7);
    if (Math.random() < 0.17) {
      const k = Math.random() < pH ? 'h' : 'a', o = k === 'h' ? 'a' : 'h', at = side[k], df = side[o];
      const pool = at.xi.filter(p => !ST(p).r);
      const sh = wpick(pool, p => ({ FW: 5, MF: 2.2, DF: 0.6, GK: 0.02 }[p.pos]));
      const as = wpick(pool.filter(p => p !== sh), p => ({ FW: 2, MF: 3, DF: 0.8, GK: 0.05 }[p.pos]));
      const q = (at.st.att * 0.6 + at.st.mid * 0.4) - (df.st.def * 0.6 + df.st.mid * 0.4);
      if (Math.random() > clamp(0.45 + q / 200, 0.25, 0.68)) events.push({ m, k, type: 'miss', text: `${sh.name} شوت زد؛ بیرون` });
      else if (Math.random() < clamp(0.30 + (sh.ovr - df.st.gk) / 150 + q / 300, 0.08, 0.6)) {
        at.g++; ST(sh).g++; ST(as).a++;
        events.push({ m, k, type: 'goal', text: `⚽ گل! ${sh.name} (پاس: ${as.name})` });
      } else {
        const gk = df.xi.find(p => p.pos === 'GK'); if (gk) ST(gk).sv++;
        events.push({ m, k, type: 'save', text: `🧤 ${gk ? gk.name : 'دروازه‌بان'} شوت ${sh.name} را مهار کرد` });
      }
    }
    if (Math.random() < 0.016) {
      const k = Math.random() < 0.5 ? 'h' : 'a', p = wpick(side[k].xi.filter(x => !ST(x).r && x.pos !== 'GK'), () => 1), s = ST(p);
      s.y++;
      if (s.y >= 2) { s.r = 1; events.push({ m, k, type: 'red', text: `🟥 ${p.name} با کارت زرد دوم اخراج شد` }); }
      else events.push({ m, k, type: 'yellow', text: `🟨 کارت زرد برای ${p.name}` });
    }
    if (Math.random() < 0.0016) {
      const k = Math.random() < 0.5 ? 'h' : 'a', p = wpick(side[k].xi, () => 1);
      events.push({ m, k, type: 'inj', pl: p, text: `🩺 ${p.name} مصدوم شد` });
    }
  }
  const rate = k => {
    const o = k === 'h' ? 'a' : 'h', gf = side[k].g, ga = side[o].g;
    return side[k].xi.map(p => {
      const s = ST(p);
      let r = 6.2 + rnd(-0.5, 0.5) + s.g * 1.1 + s.a * 0.7 + s.sv * 0.35 - s.y * 0.25 - s.r * 1.5 + (gf > ga ? 0.3 : gf < ga ? -0.3 : 0);
      if (p.pos === 'GK' || p.pos === 'DF') r += ga === 0 ? 0.5 : -0.2 * ga;
      return { name: p.name, pos: p.pos, g: s.g, a: s.a, y: s.y, r: s.r, rating: Math.round(clamp(r, 3.5, 10) * 10) / 10 };
    });
  };
  return { hg: side.h.g, ag: side.a.g, events, ratings: { h: rate('h'), a: rate('a') } };
}

async function runMatch(i) {
  const f = S.fixtures[i], box = $('#matchView');
  if (S.real && !S.coachName) { toast('مربی نداری؛ اول مربی استخدام کن'); return show('office'); }
  const xi = autoPick(S.squad, S.formation), err = lineupError(xi);
  if (err) { toast(err); return show('lineup'); }
  const weHome = f.home.id === MADRID, opp = weHome ? f.away : f.home;
  box.innerHTML = '<p class="hint">⏳ در حال آماده‌سازی ترکیب حریف...</p>';
  let oxi;
  try { oxi = await opponentXI(f, opp.id, opp.name); } catch (e) { toast('⚠️ ' + e.message); return renderFixtures(); }
  const us = { name: 'رئال مادرید', xi }, them = { name: opp.name, xi: oxi.xi };
  const res = weHome ? simulate(us, them) : simulate(them, us);
  const H = weHome ? us : them, A = weHome ? them : us;
  box.innerHTML = `<div class="board"><div><b>${esc(H.name)}</b></div><div><div class="sc" id="sc">0 - 0</div><small id="mn">۰'</small></div><div><b>${esc(A.name)}</b></div></div>
    <p class="hint">چیدمان حریف: ${esc(oxi.formation)} <button id="skip">رد کردن</button></p><div class="feed" id="feed"></div><div id="after"></div>`;
  let idx = 0, gh = 0, ga = 0, done = false;
  const step = () => {
    const ev = res.events[idx++]; if (!ev) return;
    if (ev.type === 'goal') ev.k === 'h' ? gh++ : ga++;
    $('#sc').textContent = `${gh} - ${ga}`; $('#mn').textContent = ev.m + "'";
    if (ev.type !== 'miss') $('#feed').insertAdjacentHTML('afterbegin', `<div class="ev ${ev.type}"><span class="m">${ev.m}'</span><span>${esc(ev.text)}</span></div>`);
  };
  const finish = () => { if (done) return; done = true; clearInterval(t); $('#mn').textContent = 'پایان'; finishMatch(f, res, weHome, opp, H, A); };
  const t = setInterval(() => { if (idx >= res.events.length) finish(); else step(); }, 380);
  $('#skip').onclick = () => { clearInterval(t); while (idx < res.events.length) step(); finish(); };
}

function ratingTable(name, list) {
  const best = Math.max(...list.map(p => p.rating));
  return `<h3>${esc(name)}</h3><table><tr><th>بازیکن</th><th>پست</th><th></th><th>امتیاز</th></tr>` +
    list.map(p => `<tr><td>${esc(p.name)}</td><td>${p.pos}</td><td>${'⚽'.repeat(p.g)}${'🅰️'.repeat(p.a)}${p.r ? '🟥' : p.y ? '🟨' : ''}</td><td><span class="rt ${p.rating >= 7.5 ? 'hi' : p.rating < 6 ? 'lo' : ''} ${p.rating === best ? 'mv' : ''}">${p.rating.toFixed(1)}</span></td></tr>`).join('') + '</table>';
}
function finishMatch(f, res, weHome, opp, H, A) {
  const gf = weHome ? res.hg : res.ag, gaa = weHome ? res.ag : res.hg;
  const outcome = gf > gaa ? 'W' : gf < gaa ? 'L' : 'D', diff = Math.abs(gf - gaa);
  const d = { W: [3, 4, 2], D: [0, -1, 0], L: [-4, -6, -3] }[outcome];
  const big = outcome === 'L' && diff >= 3 ? 2 : 1;
  S.board = clamp(S.board + d[0] * big, 0, 100); S.fans = clamp(S.fans + d[1] * big, 0, 100); S.coach = clamp(S.coach + d[2], 0, 100);
  const text = `${H.name} ${res.hg}-${res.ag} ${A.name}`;

  const m = $('#syncMsg'); S.fm = normUrl($('#setFm').value); if (!S.fm) return toast('آدرس Worker را وارد کن'); save(); m.textContent = '⏳ تست...';

    const s = await fm('mbappe', 'search'), d = await fm(`/teams/${FMRM}/overview/real-madrid`), q = fmSquad(d), fx = fmFix(d);
    m.textContent = `✅ اتصال برقرار است | جستجو: ${Object.keys(s).join(',')} | بازیکن: ${q.players.length} | مربی: ${q.coach || '—'} | بازی: ${fx.length} | کلیدها: ${Object.keys(d).slice(0, 8).join(',')}`;
  } catch (e) { m.textContent = '⚠️ ' + e.message; }
};
/* ===== پایان FotMob ===== */
/* ===== افزوده‌ها: پروفایل، مالی، اختیارات ===== */
function photo(p) { if (typeof p.id !== 'number') return ''; return S.fm ? `<img class="ph" loading="lazy" src="https://images.fotmob.com/image_resources/playerimages/${p.id}.png" onerror="this.remove()">` : S.real ? `<img class="ph" loading="lazy" src="https://media.api-sports.io/football/players/${p.id}.png" onerror="this.remove()">` : ''; }
$('#chips').onclick = e => { const b = e.target.closest('button'); if (b) { $('#msg').value = b.dataset.t; $('#msg').focus(); } };
async function openProfile(kind, id, name) {
  const m = $('#modal'); m.hidden = false;
  m.innerHTML = '<div class="card"><button class="x">✕</button><div id="pf"><p class="hint">⏳ در حال دریافت رزومه...</p></div></div>';
  m.onclick = e => { if (e.target === m || e.target.classList.contains('x')) m.hidden = true; };
  const pf = $('#pf'), loc = S.squad.find(x => String(x.id) === String(id));
  try {
    if (S.fm && !isNaN(+id)) { await fmProfile(pf, id); return; }
    if (!S.server || isNaN(+id)) { pf.innerHTML = `<h3>${esc(loc?.name || name)}</h3><p class="hint">${loc ? loc.pos + ' · ' + loc.age + ' ساله · رتبه ' + loc.ovr + '<br>' : ''}رزومه کامل فقط برای بازیکن/مربی واقعی و با سرور متصل نمایش داده می‌شود.</p>`; return; }
    if (kind === 'coach') {
      const c = (await football('coachs', { id })).response?.[0]; if (!c) throw new Error('یافت نشد');
      pf.innerHTML = `<h3>${esc(c.name)}</h3><p class="hint">${esc(c.nationality || '')} · ${c.age || '?'} ساله</p><h3>سوابق مربیگری</h3>` + (c.career || []).map(k => `<div class="item"><div class="grow"><b>${esc(k.team?.name)}</b></div><small>${esc(k.start || '?')} ← ${esc(k.end || 'اکنون')}</small></div>`).join('');
      return;
    }
    const [a, t] = await Promise.all([football('players', { id, season: SEASON }), football('players/teams', { player: id })]);
    let r = a.response?.[0], season = SEASON;
    if (!r?.statistics?.length) { r = (await football('players', { id, season: SEASON - 1 })).response?.[0]; season = SEASON - 1; }
    if (!r) throw new Error('یافت نشد');
    const p = r.player;
    pf.innerHTML = `<div class="item"><img class="ph big" src="${esc(p.photo || '')}" onerror="this.remove()"><div class="grow"><h3 style="margin:0">${esc(p.name)}</h3><small>${esc(p.nationality || '')} · ${p.age || '?'} ساله · ${esc(p.height || '')} ${esc(p.weight || '')}</small></div></div>` +
      `<h3>عملکرد فصل ${season}/${String(season + 1).slice(2)}</h3><table><tr><th>تیم / لیگ</th><th>بازی</th><th>گل</th><th>پاس گل</th><th>امتیاز</th></tr>` +
      (r.statistics || []).map(s => `<tr><td>${esc(s.team.name)}<small> ${esc(s.league.name)}</small></td><td>${s.games.appearences ?? 0}</td><td>${s.goals.total ?? 0}</td><td>${s.goals.assists ?? 0}</td><td>${s.games.rating ? (+s.games.rating).toFixed(2) : '-'}</td></tr>`).join('') + '</table>' +
      `<h3>رزومه (باشگاه‌ها)</h3>` + (t.response || []).map(x => `<div class="item"><div class="grow"><b>${esc(x.team.name)}</b></div><small>${Math.min(...x.seasons)}–${Math.max(...x.seasons)}</small></div>`).join('') +
      `<button class="primary" id="pv" style="margin-top:12px">ارزش بازار و قرارداد</button><div class="val" id="pvv" hidden></div>`;
    $('#pv').onclick = async () => { const v = $('#pvv'); v.hidden = false; v.textContent = '⏳ جستجو...'; try { v.textContent = (await api('/api/value?name=' + encodeURIComponent(p.name))).text; } catch (er) { v.textContent = '⚠️ ' + er.message; } };
  } catch (e) { pf.innerHTML = `<p class="hint">⚠️ ${esc(e.message)}</p>`; }
}
function renderFin() {
  $('#finBox').innerHTML = `<div class="meter"><span><b>بودجه نقل‌وانتقالات</b><span>${S.budget.toLocaleString('fa-IR')} م€</span></span></div><p class="hint">مربی فعلی: <b>${esc(S.coachName || 'ندارد')}</b></p><h3>اسپانسرها</h3>` +
    (S.sponsors.length ? S.sponsors.map(s => `<div class="item"><div class="grow"><b>${esc(s.name)}</b><small>${esc(s.note)}</small></div><span class="ovr">${s.value} م€</span></div>`).join('') : '<p class="hint">چیزی ثبت نشده.</p>') +
    (S.clubInfo ? `<h3>اطلاعات مالی باشگاه</h3><div class="val">${esc(S.clubInfo)}</div>` : '');
}
$('#finGo').onclick = async () => { if (!S.server) return toast('اطلاعات مالی واقعی به جستجوی وب (سرور هوش مصنوعی پولی) نیاز دارد'); const b = $('#finGo'); b.textContent = '⏳...'; try { S.clubInfo = (await api('/api/club')).text; save(); renderFin(); } catch (e) { toast('⚠️ ' + e.message); } b.textContent = 'دریافت اطلاعات مالی واقعی'; };
$('#powers').onclick = e => { const b = e.target.closest('button'); if (b) { show('office'); $('#msg').value = b.dataset.t; $('#msg').focus(); } };
S.fm = normUrl(S.fm); S.server = normUrl(S.server);
setInterval(() => { if ((S.server || S.fm) && S.real) $('#sync').click(); }, 30 * 60 * 1000);
show('office');
</script>
</body>
